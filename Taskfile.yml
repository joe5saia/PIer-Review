version: "3"

set: [errexit, pipefail]

tasks:
  default:
    desc: List the workspace tasks
    cmd: task --list
    silent: true

  install:
    desc: Install locked dependencies for all workspace projects
    cmd: pnpm install --frozen-lockfile

  fmt:
    desc: Format the entire workspace
    cmd: pnpm exec oxfmt

  fmt:check:
    desc: Check formatting across the workspace
    cmd: pnpm exec oxfmt --check

  lint:
    desc: Lint shared configuration and every project
    cmds:
      - pnpm exec oxlint --type-aware --deny-warnings oxlint.config.ts
      - pnpm -r --if-present run lint

  lint:fix:
    desc: Apply automatic lint corrections across the workspace
    cmds:
      - pnpm exec oxlint --type-aware --fix oxlint.config.ts
      - pnpm -r --if-present run lint:fix

  typecheck:
    desc: Typecheck every project
    cmd: pnpm -r --if-present run typecheck

  build:
    desc: Build every project
    cmd: pnpm -r --if-present run build

  image:
    desc: Cache container images required by workspace projects
    cmd: pnpm -r --if-present run image

  dev:
    desc: Build and launch the Pier Review desk
    cmd: pnpm --filter pier-review run dev

  test:
    desc: Run every project's tests (including its build prerequisites)
    cmd: pnpm -r --if-present run test

  test:watch:
    desc: Watch the Pier Review research scenarios
    cmd: pnpm --filter pier-review run test:watch

  check:
    desc: Run all workspace checks, the same as CI
    cmds:
      - task: fmt:check
      - task: lint
      - task: typecheck
      - task: test
